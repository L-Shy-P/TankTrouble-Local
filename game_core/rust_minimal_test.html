<div>
<button id="run">运行 Rust 最小决策</button>

<div id="out"><span class="muted">尚未运行。点击“运行 Rust 最小决策”。</span></div>
</div>
<script src="js/vantage_rust_bridge.js?v=1"></script>
<script>
var out=document.getElementById('out');
var ta=document.getElementById('in');
function render(html, cls){out.className=cls||'';out.innerHTML=html;}
document.getElementById('loadDefault').onclick=function(){location.reload();};
document.getElementById('run').onclick=async function(){
  render('<span class="muted">初始化 WASM...</span>');
  try{
    var r=await VantageRustBridge.init();
    if(!r.ok) throw new Error(r.error||'init failed');
    var cfg=JSON.parse(ta.value);
    var res=VantageRustBridge.minimalDecide(cfg.candidates,{
      epsilon:cfg.epsilon, tMin:cfg.tMin, tMax:cfg.tMax
    });
    if(!res.ok) throw new Error(res.error||'minimalDecide failed');
    render(
      '<span class="ok">运行成功</span>\n' +
      'selectedIndex: ' + res.selectedIndex + '\n' +
      'segmentFrames: ' + res.segmentFrames + '\n' +
      '选中操作: ' + cfg.candidates[res.selectedIndex].opName, 'ok'
    );
  }catch(e){
    render('<span class="err">错误: ' + (e&&e.message?e.message:e) + '</span>', 'err');
  }
};
</script>
