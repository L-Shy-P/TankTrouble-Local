    <script>
      window.WebFont = window.WebFont || {
        load: function (o) {
          try {
            var css = (o && o.custom && o.custom.urls && o.custom.urls[0]) || 'css/fonts.css';
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = css;
            document.head.appendChild(l);
          } catch (e) {}
          try { if (o && typeof o.active === 'function') o.active(); } catch (e2) {}
        }
      };
    </script>

<script>
(function() {
    'use strict';

    var _origMain = window.main;

    window.main = function() {
        if (window.TankTroubleLocalPatch) {
            TankTroubleLocalPatch.applyAjaxPatch();
            TankTroubleLocalPatch.applyDeferredPatches();
        }
        if (typeof TankTroubleAITactics !== 'undefined') {
            TankTroubleAITactics.install();
        }

        if (typeof TankTrouble !== 'undefined') {
            if (TankTrouble.LoginOverlay) TankTrouble.LoginOverlay.show = function() {};
            if (TankTrouble.SignUpOverlay) TankTrouble.SignUpOverlay.show = function() {};
            if (TankTrouble.Scrapyard) TankTrouble.Scrapyard.init = function() {};
            if (TankTrouble.Messages) TankTrouble.Messages.init = function() {};
            if (TankTrouble.Statistics) TankTrouble.Statistics.init = function() {};
        }

        if (typeof Content !== 'undefined' && Content.navigateToTab) {
            var _origNavigateToTab = Content.navigateToTab;
            Content.navigateToTab = function(tab, path, data) {
                if (tab === 'game') _origNavigateToTab.call(Content, tab, path, data);
            };
        }

        if (_origMain) _origMain.call(window);

        setTimeout(function() {
            $('#messagesSnippet, .messagesSnippet').hide();
            $('#scrapyardSnippet, .scrapyardSnippet').hide();
            $('#shopTab, #newsTab, #forumTab').hide();
            $('#version').hide();
        }, 500);
    };

    $(function() {
        if (typeof TankTroubleAITactics !== 'undefined') {
            TankTroubleAITactics.install();
        }
        if (window.TankTroubleLocalPatch) {
            TankTroubleLocalPatch.applyDeferredPatches();
        }
        try { main(); } catch (e) { console.error('[Local Patch] main() error:', e); }
        if (typeof load_red_infiltration === 'function') {
            try { load_red_infiltration(); } catch (e) {}
        }
    });
})();
</script>
